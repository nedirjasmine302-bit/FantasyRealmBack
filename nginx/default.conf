server {
  listen 80;
  server_name _;

  root /var/www/html/public;
  index index.php;

  # Cache la version de nginx (moins d'infos pour un attaquant)
  server_tokens off;

  # Limite la taille des uploads (images de personnages / accessoires)
  client_max_body_size 8M;

  # En-têtes de sécurité
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri /index.php$is_args$args;
  }

  # PHP autorisé UNIQUEMENT pour le point d'entrée Symfony (index.php)
  location ~ ^/index\.php(/|$) {
    fastcgi_pass php:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    internal;
  }

  # Tout autre fichier .php est refusé (empêche l'exécution d'un fichier uploadé)
  location ~ \.php$ {
    return 404;
  }

  # Bloque l'accès aux fichiers cachés (.env, .git, etc.)
  location ~ /\. {
    deny all;
  }
}
