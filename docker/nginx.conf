# Config nginx de PRODUCTION.
# ${PORT} est remplacé au démarrage par le port fourni par Railway (voir entrypoint.sh).
server {
    listen ${PORT};
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 8M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP autorisé uniquement pour le point d'entrée Symfony (php-fpm dans le même conteneur)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        internal;
    }

    # Tout autre .php refusé (empêche l'exécution d'un fichier uploadé)
    location ~ \.php$ {
        return 404;
    }

    # Bloque l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
    }
}
